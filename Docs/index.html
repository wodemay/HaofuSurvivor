<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProjectSurvivor 文档</title>
  <style>
    :root { color-scheme: dark; --bg:#10141b; --panel:#171d27; --line:#2a3444; --text:#e8edf5; --muted:#9ba8bb; --accent:#72a7ff; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif; }
    .layout { display:grid; grid-template-columns:290px 1fr; min-height:100vh; }
    aside { background:var(--panel); border-right:1px solid var(--line); padding:22px 16px; position:sticky; top:0; height:100vh; overflow:auto; }
    h1 { font-size:20px; margin:0 0 16px; } #search { width:100%; padding:9px 10px; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:6px; }
    nav { margin-top:16px; } nav button { width:100%; text-align:left; color:var(--muted); background:none; border:0; border-radius:5px; padding:8px 10px; cursor:pointer; } nav button:hover, nav button.active { color:var(--text); background:#243149; }
    main { max-width:980px; width:100%; padding:38px clamp(22px,5vw,70px); } article { min-height:80vh; } .meta { color:var(--muted); font-size:13px; margin-top:-8px; }
    h2,h3,h4 { margin-top:30px; line-height:1.3; } a { color:var(--accent); } code { background:#252e3b; padding:2px 5px; border-radius:4px; } pre { overflow:auto; padding:16px; background:#0b0f15; border:1px solid var(--line); border-radius:7px; } pre code { background:none; padding:0; }
    table { border-collapse:collapse; width:100%; margin:14px 0; } th,td { border:1px solid var(--line); padding:7px 10px; text-align:left; } th { background:#202a39; }
    blockquote { margin:14px 0; padding:4px 14px; border-left:3px solid var(--accent); color:var(--muted); } .empty { color:var(--muted); }
    @media (max-width:760px) { .layout { grid-template-columns:1fr; } aside { position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); } }
  </style>
</head>
<body>
  <div class="layout"><aside><h1>ProjectSurvivor 文档</h1><input id="search" placeholder="搜索文档" autocomplete="off"><nav id="nav"></nav></aside><main><article id="content"><p class="empty">正在加载文档…</p></article></main></div>
  <script src="docs-data.js"></script><script src="docs-viewer.js"></script>
</body>
</html>
