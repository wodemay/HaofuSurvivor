name: Unity Windows Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unity-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f3
          targetPlatform: StandaloneWindows64
          buildMethod: HaoFuSurvivor.Editor.ProjectBuild.BuildWindows
          buildPath: Build/StandaloneWindows64/HaofuSurvivor.exe

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HaofuSurvivor-Windows-${{ github.sha }}
          path: Build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14

      - name: Archive Windows package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd Build/StandaloneWindows64
          zip -r "$GITHUB_WORKSPACE/HaofuSurvivor-Windows-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "HaofuSurvivor-Windows-${GITHUB_REF_NAME}.zip" \
            --title "HaofuSurvivor ${GITHUB_REF_NAME}" \
            --generate-notes
